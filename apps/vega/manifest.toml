# Lingo for Vega OS (experimental; docs/plans/LING-008.md §3). Shape and comments follow Amazon's samples:
# https://github.com/AmazonAppDev/vega-video-sample/blob/main/manifest.toml (RN for Vega 0.83 runtime-module)
# https://github.com/AmazonAppDev/react-native-multi-tv-app-sample/blob/main/apps/vega/manifest.toml ([wants] list)
# `pnpm check:vega` (scripts/check-vega.mjs) checks this file against package.json and app.json without the SDK.
schema-version = 1

[package]
# Reuses the Fire OS application id (apps/expo/app.json android.package). vega-video-sample's manifest: "Existing FireTV app
# developers with apps on FireOS devices must reuse their existing application id to ensure existing Amazon integrations,
# viz. IAP, continue to work." LING-007 confirms (docs/plans/LING-008.md open question 7).
id = "dev.moizp.lingo"
title = "Lingo"
version = "0.1.0"
# Placeholder art (tokens ground colour); the size rules are to be checked in the Vega manifest docs.
icon = "@image/lingo-icon.png"

[os.version]
min = "1.2"
target = "1.2"

[components]
[[components.interactive]]
id = "dev.moizp.lingo.main"
# RN for Vega 0.83 track (react-native-kepler 4.x). The 0.72 track uses "/com.amazon.kepler.keplerscript.runtime.loader_2@IKeplerScript_2_0".
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main", "com.amazon.category.kepler.media"]

[processes]
[[processes.group]]
component-ids = ["dev.moizp.lingo.main"]

# Optional capabilities, copied from the multi-TV sample. LING-007 adds the IAP, Content Launcher and Media Controls
# entries ([needs]/[offers]/[[extras]]) when it wires the platform bindings.
[wants]
[[wants.service]]
id = "com.amazon.inputmethod.service"

# Media player / transform (video playback is off on Vega until KIT-010; kept so the switch is a code change only)
[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.mediametrics.service"

# Remote button events
[[wants.service]]
id = "com.amazon.inputd.service"

# Media Controls
[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

# Accessibility (VoiceView labels)
[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

# Required for GIPC SR — audio/video playback
[[wants.service]]
id = "com.amazon.gipc.uuid.*"

# Audio
[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.audio.system"

# Network information (catalog, websocket to the phone)
[[wants.service]]
id = "com.amazon.network.service"
